<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 Smart Campus Events</a>
        <a class="btn btn-outline-light btn-sm" href="/">← Back</a>
    </div>
</nav>
<div class="container" style="max-width: 600px;">
    <div class="card p-4">
        <h3 class="mb-1">Book Tickets</h3>
        <p class="text-muted" th:text="${event.name} + ' · ₹' + ${event.ticketPrice} + ' per ticket'"></p>
        <p class="small text-success" th:text="${event.availableTickets} + ' tickets available'"></p>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/register/{id}(id=${event.id})}" th:object="${student}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" th:field="*{name}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email *</label>
                <input type="email" th:field="*{email}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control" placeholder="e.g. CSE">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Number of Tickets *</label>
                <input type="number" name="numberOfTickets" class="form-control"
                       th:value="${numberOfTickets}" min="1" th:max="${event.availableTickets}" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Confirm Booking</button>
        </form>
    </div>
</div>
</body>
</html>
