<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 Smart Campus Events</a>
    </div>
</nav>
<div class="container" style="max-width: 500px;">
    <div class="card p-4 text-center">
        <div style="font-size: 3rem;">✅</div>
        <h3 class="text-success mt-2">Booking Confirmed!</h3>
        <div th:if="${registration}">
            <hr>
            <p class="mb-1"><strong th:text="${registration.student.name}"></strong></p>
            <p class="text-muted mb-1" th:text="${registration.event.name}"></p>
            <p class="mb-1">Tickets: <strong th:text="${registration.numberOfTickets}"></strong></p>
            <p class="mb-3">Total: <strong class="text-success" th:text="'₹' + ${registration.totalAmount}"></strong></p>
        </div>
        <a href="/" class="btn btn-primary">Back to Events</a>
        <a href="/my-registrations" class="btn btn-outline-secondary mt-2">View My Bookings</a>
    </div>
</div>
</body>
</html>
