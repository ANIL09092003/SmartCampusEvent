<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Campus Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 Smart Campus Events</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/my-registrations">My Bookings</a>
            <a class="btn btn-warning btn-sm" href="/admin" sec:authorize="hasRole('ADMIN')">Admin</a>
            <a class="btn btn-outline-light btn-sm" href="/login" sec:authorize="!isAuthenticated()">Admin Login</a>
            <a class="btn btn-outline-danger btn-sm" href="/logout" sec:authorize="isAuthenticated()">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="hero">
        <h1 class="mb-2">Campus Events & Workshops</h1>
        <p class="mb-0 opacity-75">Browse upcoming events, workshops and seminars. Book your tickets online.</p>
    </div>

    <!-- Filters -->
    <form class="filter-bar row g-2 align-items-end" method="get" action="/">
        <div class="col-md-3">
            <label class="form-label small text-muted">Department</label>
            <input type="text" name="department" class="form-control" placeholder="e.g. CSE" th:value="${department}">
        </div>
        <div class="col-md-3">
            <label class="form-label small text-muted">Type</label>
            <select name="type" class="form-select">
                <option value="">All Types</option>
                <option value="Workshop" th:selected="${type == 'Workshop'}">Workshop</option>
                <option value="Seminar" th:selected="${type == 'Seminar'}">Seminar</option>
                <option value="Fest" th:selected="${type == 'Fest'}">Fest</option>
                <option value="Cultural" th:selected="${type == 'Cultural'}">Cultural</option>
                <option value="Sports" th:selected="${type == 'Sports'}">Sports</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small text-muted">Date</label>
            <input type="date" name="date" class="form-control" th:value="${date}">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100">🔍 Search</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-4" th:each="e : ${events}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-primary" th:text="${e.type}">Type</span>
                        <span class="badge" th:classappend="${e.availableTickets > 0} ? 'bg-success' : 'bg-danger'"
                              th:text="${e.availableTickets > 0} ? ${e.availableTickets} + ' left' : 'Sold Out'"></span>
                    </div>
                    <h5 class="card-title" th:text="${e.name}">Event Name</h5>
                    <p class="text-muted small mb-1">
                        📍 <span th:text="${e.venue} ?: 'TBA'"></span> ·
                        🏢 <span th:text="${e.department}"></span>
                    </p>
                    <p class="text-muted small mb-2">
                        📅 <span th:text="${e.date}"></span>
                        <span th:if="${e.time}"> · 🕒 <span th:text="${e.time}"></span></span>
                    </p>
                    <p class="card-text small" th:text="${e.description}"></p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fw-bold text-success" th:text="${e.ticketPrice == 0} ? 'Free' : '₹' + ${e.ticketPrice}"></span>
                        <div>
                            <a th:href="@{/events/{id}(id=${e.id})}" class="btn btn-outline-secondary btn-sm">Details</a>
                            <a th:if="${e.availableTickets > 0}" th:href="@{/register/{id}(id=${e.id})}" class="btn btn-primary btn-sm">Book</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(events)}">
            <h4>No events found</h4>
            <p>Try changing the filters or check back later.</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
