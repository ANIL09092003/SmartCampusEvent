<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 Smart Campus Events</a>
        <a class="btn btn-outline-light btn-sm" href="/">← Events</a>
    </div>
</nav>
<div class="container">
    <h3 class="mb-3">My Bookings</h3>
    <form class="row g-2 mb-4" method="get">
        <div class="col-md-6">
            <input type="email" name="email" class="form-control" placeholder="Enter your email" th:value="${email}" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
    </form>

    <div th:if="${registrations != null}">
        <div th:if="${#lists.isEmpty(registrations)}" class="alert alert-info">No bookings found for this email.</div>
        <table class="table table-hover bg-white" th:unless="${#lists.isEmpty(registrations)}">
            <thead class="table-dark">
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Tickets</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Booked On</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${registrations}">
                <td th:text="${r.event.name}"></td>
                <td th:text="${r.event.date}"></td>
                <td th:text="${r.numberOfTickets}"></td>
                <td th:text="'₹' + ${r.totalAmount}"></td>
                <td><span class="badge bg-success" th:text="${r.status}"></span></td>
                <td th:text="${#temporals.format(r.registrationDate, 'dd MMM yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
