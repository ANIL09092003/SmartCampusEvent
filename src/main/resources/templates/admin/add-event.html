<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/admin">⚙️ Admin</a>
        <a class="btn btn-outline-light btn-sm" href="/admin">← Dashboard</a>
    </div>
</nav>
<div class="container" style="max-width: 700px;">
    <div class="card p-4">
        <h3 class="mb-4">Add New Event</h3>
        <form th:action="@{/save}" th:object="${event}" method="post">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Event Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                    <div class="text-danger small" th:errors="*{name}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Type *</label>
                    <select th:field="*{type}" class="form-select" required>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Fest">Fest</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Department *</label>
                    <input type="text" th:field="*{department}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Venue</label>
                    <input type="text" th:field="*{venue}" class="form-control" placeholder="Auditorium / Lab 3">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date *</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Time</label>
                    <input type="time" th:field="*{time}" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ticket Price (₹)</label>
                    <input type="number" step="0.01" th:field="*{ticketPrice}" class="form-control" value="0">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Total Tickets *</label>
                    <input type="number" th:field="*{totalTickets}" class="form-control" min="1" value="100" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="UPCOMING">Upcoming</option>
                        <option value="ONGOING">Ongoing</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4 w-100">Save Event</button>
        </form>
    </div>
</div>
</body>
</html>
