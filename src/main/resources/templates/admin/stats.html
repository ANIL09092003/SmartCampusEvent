<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration Statistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/admin">⚙️ Admin</a>
        <a class="btn btn-outline-light btn-sm" href="/admin">← Dashboard</a>
    </div>
</nav>
<div class="container">
    <h3 class="mb-4">📊 Registration Statistics</h3>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card p-3">
                <h5>By Department</h5>
                <table class="table table-sm">
                    <thead><tr><th>Department</th><th>Registrations</th></tr></thead>
                    <tbody>
                    <tr th:each="row : ${byDept}">
                        <td th:text="${row[0]}"></td>
                        <td><strong th:text="${row[1]}"></strong></td>
                    </tr>
                    </tbody>
                </table>
                <p th:if="${#lists.isEmpty(byDept)}" class="text-muted">No data yet</p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3">
                <h5>By Event</h5>
                <table class="table table-sm">
                    <thead><tr><th>Event</th><th>Registrations</th></tr></thead>
                    <tbody>
                    <tr th:each="row : ${byEvent}">
                        <td th:text="${row[0]}"></td>
                        <td><strong th:text="${row[1]}"></strong></td>
                    </tr>
                    </tbody>
                </table>
                <p th:if="${#lists.isEmpty(byEvent)}" class="text-muted">No data yet</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
