<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/admin">⚙️ Admin Panel</a>
        <div class="d-flex gap-2">
            <a class="btn btn-success btn-sm" href="/add">+ Add Event</a>
            <a class="btn btn-info btn-sm" href="/stats">📊 Stats</a>
            <a class="btn btn-outline-light btn-sm" href="/">Public Site</a>
            <a class="btn btn-outline-danger btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <h3 class="mb-3">Manage Events</h3>
    <table class="table table-hover bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Dept</th>
            <th>Type</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Price</th>
            <th>Tickets</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${events}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.name}"></td>
            <td th:text="${e.department}"></td>
            <td><span class="badge bg-primary" th:text="${e.type}"></span></td>
            <td th:text="${e.date}"></td>
            <td th:text="${e.venue}"></td>
            <td th:text="${e.ticketPrice == 0} ? 'Free' : '₹' + ${e.ticketPrice}"></td>
            <td th:text="${e.availableTickets} + '/' + ${e.totalTickets}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${e.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a th:href="@{/delete/{id}(id=${e.id})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Delete this event?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${#lists.isEmpty(events)}" class="text-center text-muted py-4">
        No events yet. <a href="/add">Create the first one</a>
    </div>
</div>
</body>
</html>
